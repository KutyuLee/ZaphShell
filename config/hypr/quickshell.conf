# ==============================================================================
# CHROMASHELL HYPRLAND CONFIGURATION MODULE
# Include this file in your main hyprland.conf:
#   source = ~/.config/hypr/quickshell.conf
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. AUTOSTART & ENVIRONMENT
# ------------------------------------------------------------------------------
exec-once = quickshell --no-duplicate
exec-once = hyprpaper
exec-once = wl-paste --type text --watch ~/.config/quickshell/scripts/clipboard.sh record
exec-once = wl-paste --type image --watch ~/.config/quickshell/scripts/clipboard.sh record

# Recommended appearance settings to harmonize with ChromaShell Frame & Glass Panels
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = 0x121316
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

general {
    gaps_in = 5
    gaps_out = 10, 12, 12, 12
    border_size = 1
    col.active_border = rgba(ffffff4c) rgba(ffffff1c) 45deg
    col.inactive_border = rgba(ffffff0e)
}

decoration {
    rounding = 24
    shadow {
        enabled = true
        range = 8
        render_power = 3
        color = 0x0effffff
        color_inactive = 0x12000000
    }
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        xray = false
    }
}

# ------------------------------------------------------------------------------
# 2. KEY MODIFIERS & SCRIPT SHORTCUTS
# ------------------------------------------------------------------------------
$mainMod = SUPER
$qsScript = ~/.config/quickshell/scripts

# Unbind conflicting default Hyprland shortcuts so ChromaShell binds take over cleanly
unbind = $mainMod, 1
unbind = $mainMod, 2
unbind = $mainMod, 3
unbind = $mainMod, 4
unbind = $mainMod, 5
unbind = $mainMod, 6
unbind = $mainMod, 7
unbind = $mainMod, 8
unbind = $mainMod, 9
unbind = $mainMod, 0
unbind = $mainMod SHIFT, 1
unbind = $mainMod SHIFT, 2
unbind = $mainMod SHIFT, 3
unbind = $mainMod SHIFT, 4
unbind = $mainMod SHIFT, 5
unbind = $mainMod SHIFT, 6
unbind = $mainMod SHIFT, 7
unbind = $mainMod SHIFT, 8
unbind = $mainMod SHIFT, 9
unbind = $mainMod SHIFT, 0
unbind = $mainMod, Q
unbind = $mainMod, C
unbind = $mainMod, M
unbind = $mainMod, E
unbind = $mainMod, V
unbind = $mainMod, P
unbind = $mainMod, S
unbind = $mainMod SHIFT, S
unbind = $mainMod, A
unbind = $mainMod, T
unbind = $mainMod, W
unbind = $mainMod, D
unbind = $mainMod, F
unbind = $mainMod, L
unbind = $mainMod, N
unbind = $mainMod, SPACE
unbind = $mainMod, slash
unbind = $mainMod, period
unbind = $mainMod, left
unbind = $mainMod, right
unbind = $mainMod, up
unbind = $mainMod, down
unbind = $mainMod, mouse_down
unbind = $mainMod, mouse_up
unbind = $mainMod, mouse:272
unbind = $mainMod, mouse:273
unbind = , XF86AudioRaiseVolume
unbind = , XF86AudioLowerVolume
unbind = , XF86AudioMute
unbind = , XF86AudioMicMute
unbind = , XF86MonBrightnessUp
unbind = , XF86MonBrightnessDown
unbind = , XF86AudioNext
unbind = , XF86AudioPause
unbind = , XF86AudioPlay
unbind = , XF86AudioPrev
unbind = , Print

# ------------------------------------------------------------------------------
# 3. WORKSPACE NAVIGATION & MANAGEMENT
# ------------------------------------------------------------------------------
# Switch to Workspace [0-9]: SUPER + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Switch to Workspace Group [0-9]: CTRL + SUPER + [0-9]
bind = CTRL $mainMod, 1, workspace, 1
bind = CTRL $mainMod, 2, workspace, 11
bind = CTRL $mainMod, 3, workspace, 21
bind = CTRL $mainMod, 4, workspace, 31
bind = CTRL $mainMod, 5, workspace, 41
bind = CTRL $mainMod, 6, workspace, 51
bind = CTRL $mainMod, 7, workspace, 61
bind = CTRL $mainMod, 8, workspace, 71
bind = CTRL $mainMod, 9, workspace, 81
bind = CTRL $mainMod, 0, workspace, 91

# Move Window to Workspace [0-9]: SUPER + ALT + [0-9]
bind = $mainMod ALT, 1, movetoworkspace, 1
bind = $mainMod ALT, 2, movetoworkspace, 2
bind = $mainMod ALT, 3, movetoworkspace, 3
bind = $mainMod ALT, 4, movetoworkspace, 4
bind = $mainMod ALT, 5, movetoworkspace, 5
bind = $mainMod ALT, 6, movetoworkspace, 6
bind = $mainMod ALT, 7, movetoworkspace, 7
bind = $mainMod ALT, 8, movetoworkspace, 8
bind = $mainMod ALT, 9, movetoworkspace, 9
bind = $mainMod ALT, 0, movetoworkspace, 10

# Move Window to Workspace Silently [0-9]: SUPER + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Move Window to Workspace Group: CTRL + SUPER + ALT + [0-9]
bind = CTRL $mainMod ALT, 1, movetoworkspace, 1
bind = CTRL $mainMod ALT, 2, movetoworkspace, 11
bind = CTRL $mainMod ALT, 3, movetoworkspace, 21
bind = CTRL $mainMod ALT, 4, movetoworkspace, 31
bind = CTRL $mainMod ALT, 5, movetoworkspace, 41
bind = CTRL $mainMod ALT, 6, movetoworkspace, 51
bind = CTRL $mainMod ALT, 7, movetoworkspace, 61
bind = CTRL $mainMod ALT, 8, movetoworkspace, 71
bind = CTRL $mainMod ALT, 9, movetoworkspace, 81
bind = CTRL $mainMod ALT, 0, movetoworkspace, 91

# Next / Previous Workspace
bind = $mainMod, mouse_down, workspace, e+1
bind = CTRL $mainMod, right, workspace, e+1
bind = $mainMod, Next, workspace, e+1

bind = $mainMod, mouse_up, workspace, e-1
bind = CTRL $mainMod, left, workspace, e-1
bind = $mainMod, Prior, workspace, e-1

# Next / Previous Workspace Group
bind = CTRL $mainMod, mouse_down, workspace, +10
bind = CTRL $mainMod, mouse_up, workspace, -10

# Move Window to Next / Prev Workspace
bind = $mainMod ALT, mouse_down, movetoworkspace, e+1
bind = $mainMod ALT, Next, movetoworkspace, e+1
bind = CTRL $mainMod SHIFT, right, movetoworkspace, e+1

bind = $mainMod ALT, mouse_up, movetoworkspace, e-1
bind = $mainMod ALT, Prior, movetoworkspace, e-1
bind = CTRL $mainMod SHIFT, left, movetoworkspace, e-1

# Move Window to / from Special Workspace
bind = $mainMod ALT, S, movetoworkspace, special:magic
bind = CTRL $mainMod SHIFT, up, movetoworkspace, special:magic
bind = CTRL $mainMod SHIFT, down, movetoworkspace, e

# Show / Hide Desktop (Win+D style single-hand toggle)
bind = $mainMod, A, exec, $qsScript/show-desktop.sh

# ------------------------------------------------------------------------------
# 4. SPECIAL WORKSPACES (SCRATCHPADS)
# ------------------------------------------------------------------------------
bind = $mainMod, S, exec, $qsScript/scratchpad.sh magic
bind = CTRL SHIFT, Escape, exec, $qsScript/scratchpad.sh sysmon
bind = $mainMod, M, exec, $qsScript/scratchpad.sh music
bind = $mainMod, D, exec, $qsScript/scratchpad.sh comm

# ------------------------------------------------------------------------------
# 5. WINDOW ACTIONS & SIZING
# ------------------------------------------------------------------------------
bind = $mainMod, Q, killactive
bind = $mainMod ALT, SPACE, togglefloating
bind = $mainMod, F, fullscreen, 0
bind = $mainMod ALT, F, fullscreen, 1
bind = $mainMod ALT, backslash, exec, hyprctl dispatch -- setfloating ; hyprctl dispatch -- pin ; hyprctl dispatch -- resizeactive exact 480 270
bind = $mainMod, P, pin
bind = CTRL $mainMod, backslash, centerwindow
bind = CTRL $mainMod ALT, backslash, exec, hyprctl dispatch -- resizeactive exact 50% 50% ; hyprctl dispatch -- centerwindow

# Incremental width/height adjustments
binde = $mainMod, minus, resizeactive, -40 0
binde = $mainMod ALT, left, resizeactive, -40 0
binde = $mainMod, equal, resizeactive, 40 0
binde = $mainMod ALT, right, resizeactive, 40 0
binde = $mainMod SHIFT, minus, resizeactive, 0 -40
binde = $mainMod ALT, up, resizeactive, 0 -40
binde = $mainMod SHIFT, equal, resizeactive, 0 40
binde = $mainMod ALT, down, resizeactive, 0 40

# Move window focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move/Resize with mouse drag
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ------------------------------------------------------------------------------
# 6. SUBMAPS: RESIZE & MOVE
# ------------------------------------------------------------------------------
bind = $mainMod, X, submap, resize
submap = resize
binde = , right, resizeactive, 25 0
binde = , left, resizeactive, -25 0
binde = , up, resizeactive, 0 -25
binde = , down, resizeactive, 0 25
bind = , Escape, submap, reset
bind = , Return, submap, reset
submap = reset

bind = $mainMod, Z, submap, move
submap = move
binde = , right, moveactive, 25 0
binde = , left, moveactive, -25 0
binde = , up, moveactive, 0 -25
binde = , down, moveactive, 0 25
bind = , Escape, submap, reset
bind = , Return, submap, reset
submap = reset

# ------------------------------------------------------------------------------
# 7. WINDOW GROUPS / TABBING
# ------------------------------------------------------------------------------
bind = ALT, Tab, cyclenext
bind = SHIFT ALT, Tab, cyclenext, prev
bind = CTRL ALT, Tab, changegroupactive, f
bind = CTRL SHIFT ALT, Tab, changegroupactive, b
bind = $mainMod, comma, togglegroup
bind = $mainMod, U, moveoutofgroup
bind = $mainMod SHIFT, comma, lockactivegroup, toggle

# ------------------------------------------------------------------------------
# 8. APPLICATIONS
# ------------------------------------------------------------------------------
bind = $mainMod, T, exec, kitty
bind = $mainMod, W, exec, firefox
bind = $mainMod, C, exec, codium
bind = $mainMod, E, exec, thunar
bind = CTRL ALT, V, exec, pwvucontrol

# ------------------------------------------------------------------------------
# 9. UTILITIES & CAPTURE
# ------------------------------------------------------------------------------
bind = , Print, exec, $qsScript/screenshot.sh --fullscreen
bind = $mainMod SHIFT, S, exec, $qsScript/screenshot.sh --region

# ------------------------------------------------------------------------------
# 10. MEDIA & AUDIO
# ------------------------------------------------------------------------------
bind = CTRL $mainMod, SPACE, exec, $qsScript/media_ctl.sh play-pause
bind = CTRL $mainMod, equal, exec, $qsScript/media_ctl.sh next
bind = CTRL $mainMod, minus, exec, $qsScript/media_ctl.sh previous
bind = CTRL $mainMod, BackSpace, exec, $qsScript/media_ctl.sh stop
bind = $mainMod SHIFT, M, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Hardware multimedia keys
bindle = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindle = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindle = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindle = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindle = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindle = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindl  = , XF86AudioNext, exec, $qsScript/media_ctl.sh next
bindl  = , XF86AudioPause, exec, $qsScript/media_ctl.sh play-pause
bindl  = , XF86AudioPlay, exec, $qsScript/media_ctl.sh play-pause
bindl  = , XF86AudioPrev, exec, $qsScript/media_ctl.sh previous

# ------------------------------------------------------------------------------
# 11. CLIPBOARD & EMOJIS
# ------------------------------------------------------------------------------
bind = $mainMod, V, exec, quickshell ipc -n call shell toggleClipboard
bind = $mainMod ALT, V, exec, $qsScript/clipboard.sh delete-latest
bind = CTRL SHIFT ALT, V, exec, $qsScript/clipboard.sh paste-latest
bind = $mainMod, period, exec, command -v rofi >/dev/null 2>&1 && rofi -show emoji || (command -v wofi >/dev/null 2>&1 && wofi --show dmenu)

# ------------------------------------------------------------------------------
# 12. SYSTEM & INTERFACE
# ------------------------------------------------------------------------------
bindr = $mainMod, SUPER_L, exec, quickshell ipc -n call shell toggleLauncher
bindr = $mainMod, SUPER_R, exec, quickshell ipc -n call shell toggleLauncher
bindl = $mainMod, SPACE, exec, quickshell ipc -n call shell nextKeyboardLayout
bind  = CTRL ALT, Delete, exec, quickshell ipc -n call shell togglePowerOsd
bind  = $mainMod, N, exec, quickshell ipc -n call shell toggleControlCenter
bind  = CTRL ALT, C, exec, quickshell ipc -n call shell clearNotifs
bind  = $mainMod, L, exec, quickshell ipc -n call shell lock
bind  = $mainMod ALT, L, exec, quickshell ipc -n call shell lock
bind  = $mainMod SHIFT, L, exec, systemctl suspend
bind  = $mainMod, slash, exec, quickshell ipc -n call shell toggleCheatSheet
bind  = $mainMod, question, exec, quickshell ipc -n call shell toggleCheatSheet
